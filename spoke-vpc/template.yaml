###################################
#   Outputs
###################################

Outputs:
  VpcId:
    Description: The ID of the VPC.
    Value: !Ref Vpc
    Export:
      Name: !Sub "${AWS::StackName}-VpcId"

  VpcCidr:
    Description: VPC CIDR range.
    Value: !GetAtt Vpc.CidrBlock
    Export:
      Name: !Sub "${AWS::StackName}-VpcCidr"

  TransitGatewayId:
    Condition: SpokeProvisionOutboundInternet
    Description: The Transit Gateway ID for the selected environment
    Value: !FindInMap [EnvironmentConfiguration, !Ref Environment, TransitGatewayId]

  AWSServicesEndpointSecurityGroupId:
    Description: The ID of the security group attached to the AWS services VPC endpoints.
    Value: !GetAtt AwsServicesEndpointSecurityGroup.GroupId
    Export:
      Name: !Sub "${AWS::StackName}-AWSServicesEndpointSecurityGroupId"

  PrivateSubnetIdA:
    Description: The ID of the private subnet for Availability Zone A.
    Value: !Ref PrivateSubnetA
    Export:
      Name: !Sub "${AWS::StackName}-PrivateSubnetIdA"

  PrivateSubnetIdB:
    Description: The ID of the private subnet for Availability Zone B.
    Value: !Ref PrivateSubnetB
    Export:
      Name: !Sub "${AWS::StackName}-PrivateSubnetIdB"

  PrivateSubnetIdC:
    Condition: ProvisionAvailabilityZoneC
    Description: The ID of the private subnet for Availability Zone C.
    Value: !Ref PrivateSubnetC
    Export:
      Name: !Sub "${AWS::StackName}-PrivateSubnetIdC"

  PrivateSubnets:
    Description: A list of the private subnets
    Value: !Join
      - ','
      - - !Ref PrivateSubnetA
        - !Ref PrivateSubnetB
        - !If [ProvisionAvailabilityZoneC, !Ref PrivateSubnetC, !Ref AWS::NoValue]
    Export:
      Name: !Sub "${AWS::StackName}-PrivateSubnets"

  ProtectedSubnetIdA:
    Description: The ID of the protected subnet for Availability Zone A.
    Value: !Ref ProtectedSubnetA
    Export:
      Name: !Sub "${AWS::StackName}-ProtectedSubnetIdA"

  ProtectedSubnetIdB:
    Description: The ID of the protected subnet for Availability Zone B.
    Value: !Ref ProtectedSubnetB
    Export:
      Name: !Sub "${AWS::StackName}-ProtectedSubnetIdB"

  ProtectedSubnetIdC:
    Condition: ProvisionAvailabilityZoneC
    Description: The ID of the protected subnet for Availability Zone C.
    Value: !Ref ProtectedSubnetC
    Export:
      Name: !Sub "${AWS::StackName}-ProtectedSubnetIdC"

  ProtectedSubnets:
    Description: A list of the protected subnets
    Value: !Join
      - ','
      - - !Ref ProtectedSubnetA
        - !Ref ProtectedSubnetB
        - !If [ProvisionAvailabilityZoneC, !Ref ProtectedSubnetC, !Ref AWS::NoValue]
    Export:
      Name: !Sub "${AWS::StackName}-ProtectedSubnets"

  PublicSubnetIdA:
    Description: The ID of the public subnet for Availability Zone A.
    Value: !Ref PublicSubnetA
    Export:
      Name: !Sub "${AWS::StackName}-PublicSubnetIdA"

  PublicSubnetIdB:
    Description: The ID of the public subnet for Availability Zone B.
    Value: !Ref PublicSubnetB
    Export:
      Name: !Sub "${AWS::StackName}-PublicSubnetIdB"

  PublicSubnetIdC:
    Condition: ProvisionAvailabilityZoneC
    Description: The ID of the public subnet for Availability Zone C.
    Value: !Ref PublicSubnetC
    Export:
      Name: !Sub "${AWS::StackName}-PublicSubnetIdC"

  PublicSubnets:
    Description: A list of the public subnets
    Value: !Join
      - ','
      - - !Ref PublicSubnetA
        - !Ref PublicSubnetB
        - !If [ProvisionAvailabilityZoneC, !Ref PublicSubnetC, !Ref AWS::NoValue]
    Export:
      Name: !Sub "${AWS::StackName}-PublicSubnets"

  TgwSubnetIdA:
    Condition: SpokeProvisionOutboundInternet
    Description: The ID of the Transit Gateway subnet for Availability Zone A.
    Value: !Ref TgwSubnetA
    Export:
      Name: !Sub "${AWS::StackName}-TgwSubnetIdA"

  TgwSubnetIdB:
    Condition: SpokeProvisionOutboundInternet
    Description: The ID of the Transit Gateway subnet for Availability Zone B.
    Value: !Ref TgwSubnetB
    Export:
      Name: !Sub "${AWS::StackName}-TgwSubnetIdB"

  TgwSubnetIdC:
    Condition: SpokeProvisionOutboundInternet
    Description: The ID of the Transit Gateway subnet for Availability Zone C.
    Value: !Ref TgwSubnetC
    Export:
      Name: !Sub "${AWS::StackName}-TgwSubnetIdC"

  TgwSubnetACidr:
    Condition: SpokeProvisionOutboundInternet
    Description: The CIDR range of the Transit Gateway subnet for Availability Zone A.
    Value: !GetAtt TgwSubnetA.CidrBlock
    Export:
      Name: !Sub "${AWS::StackName}-TgwSubnetACidr"

  TgwSubnetBCidr:
    Condition: SpokeProvisionOutboundInternet
    Description: The CIDR range of the Transit Gateway subnet for Availability Zone B.
    Value: !GetAtt TgwSubnetB.CidrBlock
    Export:
      Name: !Sub "${AWS::StackName}-TgwSubnetBCidr"

  TgwSubnetCCidr:
    Condition: SpokeProvisionOutboundInternet
    Description: The CIDR range of the Transit Gateway subnet for Availability Zone C.
    Value: !GetAtt TgwSubnetC.CidrBlock
    Export:
      Name: !Sub "${AWS::StackName}-TgwSubnetCCidr"

  FirewallSubnetIdA:
    Condition: IsLegacyVpc
    Description: The ID of the firewall subnet for Availability Zone A.
    Value: !Ref FirewallSubnetA
    Export:
      Name: !Sub "${AWS::StackName}-FirewallSubnetIdA"

  FirewallSubnetIdB:
    Condition: IsLegacyVpc
    Description: The ID of the firewall subnet for Availability Zone B.
    Value: !Ref FirewallSubnetB
    Export:
      Name: !Sub "${AWS::StackName}-FirewallSubnetIdB"

  FirewallSubnetIdC:
    Condition: LegacyProvisionAvailabilityZoneC
    Description: The ID of the firewall subnet for Availability Zone C.
    Value: !Ref FirewallSubnetC
    Export:
      Name: !Sub "${AWS::StackName}-FirewallSubnetIdC"

  FirewallSubnetACidr:
    Condition: IsLegacyVpc
    Description: The CIDR range of the firewall subnet for Availability Zone A.
    Value: !GetAtt FirewallSubnetA.CidrBlock
    Export:
      Name: !Sub "${AWS::StackName}-FirewallSubnetACidr"

  FirewallSubnetBCidr:
    Condition: IsLegacyVpc
    Description: The CIDR range of the firewall subnet for Availability Zone B.
    Value: !GetAtt FirewallSubnetB.CidrBlock
    Export:
      Name: !Sub "${AWS::StackName}-FirewallSubnetBCidr"

  FirewallSubnetCCidr:
    Condition: LegacyProvisionAvailabilityZoneC
    Description: The CIDR range of the firewall subnet for Availability Zone C.
    Value: !GetAtt FirewallSubnetC.CidrBlock
    Export:
      Name: !Sub "${AWS::StackName}-FirewallSubnetCCidr"

  ApiGatewayVpcLinkId:
    Condition: ProvisionRestAPIGWVpcLink
    Description: WAF component - The ID of the VPC link only to be used with REST APIs
    Value: !Ref ApiGatewayVpcLink
    Export:
      Name: !Sub "${AWS::StackName}-ApiGatewayVpcLinkId"

  ApiGatewayVpcLinkTargetNLB:
    Condition: ProvisionRestAPIGWVpcLink
    Description: WAF component - The URN of the Network Load Balancer targeted by the VPC link (REST API)
    Value: !Ref NetworkLoadBalancer
    Export:
      Name: !Sub "${AWS::StackName}-ApiGatewayVpcLinkTargetNLB"

  ApiGatewayVpcLinkTargetNLBDNS:
    Condition: ProvisionRestAPIGWVpcLink
    Description: WAF component - The DNS name of Network Load Balancer targeted by the VPC link (REST API)
    Value: !GetAtt NetworkLoadBalancer.DNSName
    Export:
      Name: !Sub "${AWS::StackName}-ApiGatewayVpcLinkTargetNLBDNS"

  VpcLinkId:
    Condition: ProvisionVpcLink
    Description: The ID of the VPC link that connects to the private subnets.
    Value: !Ref VpcLink
    Export:
      Name: !Sub "${AWS::StackName}-VpcLinkId"

  NatGatewayZoneAEIP:
    Condition: LegacyProvisionZoneAElasticIP
    Description: The EIP allocated for the NAT Gateway in Zone A
    Value: !Ref NatGatewayZoneAEIP
    Export:
      Name: !Sub "${AWS::StackName}-NatGatewayZoneAEIP"

  NatGatewayZoneBEIP:
    Condition: LegacyProvisionZoneBElasticIP
    Description: The EIP allocated for the NAT Gateway in Zone B
    Value: !Ref NatGatewayZoneBEIP
    Export:
      Name: !Sub "${AWS::StackName}-NatGatewayZoneBEIP"

  NatGatewayZoneCEIP:
    Condition: LegacyProvisionZoneCElasticIP
    Description: The EIP allocated for the NAT Gateway in Zone C
    Value: !Ref NatGatewayZoneCEIP
    Export:
      Name: !Sub "${AWS::StackName}-NatGatewayZoneCEIP"

  ExecuteApiGatewayVpcEndpointId:
    Condition: ProvisionExecuteApiGatewayVPCEndpoint
    Description: The id of the VPC Endpoint interface for API Gateway.
    Value: !Ref ExecuteApiGatewayEndpoint
    Export:
      Name: !Sub "${AWS::StackName}-ExecuteApiGatewayEndpointId"

  ExecuteApiGatewayVpcEndpointPrimaryDnsEntry:
    Condition: ProvisionExecuteApiGatewayVPCEndpoint
    Description: >
      The primary DNS entry for the ExecuteAPI VPC Endpoint.
      Required for Private API custom domain names with internal lambdas in the same VPC.
    Value: !Select [1, !Split [':', !Select [0, !GetAtt ExecuteApiGatewayEndpoint.DnsEntries]]]
    Export:
      Name: !Sub "${AWS::StackName}-ExecuteApiGatewayVpcEndpointPrimaryDnsEntry"

  ExecuteApiGatewayVpcEndpointHostedZoneId:
    Condition: ProvisionExecuteApiGatewayVPCEndpoint
    Description: >
      The Hosted Zone ID for the ExecuteAPI VPC Endpoint.
      Required for Private API custom domain names with internal lambdas in the same VPC.
    Value: !Select [0, !Split [':', !Select [0, !GetAtt ExecuteApiGatewayEndpoint.DnsEntries]]]
    Export:
      Name: !Sub "${AWS::StackName}-ExecuteApiGatewayVpcEndpointHostedZoneId"

  FlowLogLogGroup:
    Condition: ProvisionFlowLogCloudWatch
    Description: The Name of the CloudWatch Log Group for VPC Flow Logs.
    Value: !Ref FlowLogLogGroup
    Export:
      Name: !Sub "${AWS::StackName}-FlowLogLogGroup"

  TgwRouteTableA:
    Condition: SpokeProvisionOutboundInternet
    Description: The ID of Tgw subnet Route Table A.
    Value: !Ref TgwRouteTableA
    Export:
      Name: !Sub "${AWS::StackName}-TgwRouteTableA"

  TgwRouteTableB:
    Condition: SpokeProvisionOutboundInternet
    Description: The ID of Tgw subnet Route Table B.
    Value: !Ref TgwRouteTableB
    Export:
      Name: !Sub "${AWS::StackName}-TgwRouteTableB"

  TgwRouteTableC:
    Condition: SpokeProvisionOutboundInternet
    Description: The ID of Tgw subnet Route Table C.
    Value: !Ref TgwRouteTableC
    Export:
      Name: !Sub "${AWS::StackName}-TgwRouteTableC"

  FirewallRouteTableA:
    Condition: IsLegacyVpc
    Description: The ID of Firewall Route Table A.
    Value: !Ref FirewallRouteTableA
    Export:
      Name: !Sub "${AWS::StackName}-FirewallRouteTableA"

  FirewallRouteTableB:
    Condition: IsLegacyVpc
    Description: The ID of Firewall Route Table B.
    Value: !Ref FirewallRouteTableB
    Export:
      Name: !Sub "${AWS::StackName}-FirewallRouteTableB"

  FirewallRouteTableC:
