AWSTemplateFormatVersion: 2010-09-09
Transform: AWS::Serverless-2016-10-31

Description: >
  devplatform-deploy vpc template version: Auth Version 1.0.0
  VPC and networking resources template with Transit Gateway and IPAM integration managed by dev-platform.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "VPC Type"
        Parameters:
          - VpcType
      - Label:
          default: "General Configuration"
        Parameters:
          - Environment
          - CidrBlock
          - AvailabilityZoneCount
          - VpcLinkEnabled
      - Label:
          default: "Egress Control"
        Parameters:
          - AllowedDomains
          - AllowRules
          - AdditionalAllowRules
          - DeployEgressTestLambda
          - EgressTestLambdaCustomURLs
      - Label:
          default: "NAT GW EIPs"
        Parameters:
          - ZoneAEIPAllocationId
          - ZoneBEIPAllocationId
          - ZoneCEIPAllocationId
      - Label:
          default: "Created for the Orch/Auth Secure Pipelines migration. Route table settings for VPC Peering connection"
        Parameters:
          - VpcPeeringConnectionId
          - VpcPeeringRequesterCidr
      - Label:
          default: "Disaster Recovery Settings"
        Parameters:
          - UseDisasterRecovery
      - Label:
          default: "Enabled AWS APIs"
        Parameters:
          - AppConfigApiEnabled
          - AppConfigDataApiEnabled
          - AthenaApiEnabled
          - BatchApiEnabled
          - CloudFormationEndpointEnabled
          - CloudTrailApiEnabled
          - CloudWatchApiEnabled
          - CloudWatchLogsApiEnabled
          - CodeBuildApiEnabled
          - CodeDeployApiEnabled
          - DynamoDBApiEnabled
          - DynatraceApiEnabled
          - ECRApiEnabled
          - EventsApiEnabled
          - ExecuteApiGatewayEnabled
          - FirehoseApiEnabled
          - GlueApiEnabled
          - IdentityStoreApiEnabled
          - KinesisApiEnabled
          - KMSApiEnabled
          - LambdaApiEnabled
          - LogsApiEnabled
          - PrivateCAApiEnabled
          - S3ApiEnabled
          - SecretsManagerApiEnabled
          - SESSmtpEnabled
          - SNSApiEnabled
          - SQSApiEnabled
          - SSMApiEnabled
          - SSMParametersStoreEnabled
          - StatesApiEnabled
          - STSApiEnabled
          - TextractApiEnabled
          - XRayApiEnabled
      - Label:
          default: "Rest API Gateway VPC Link"
        Parameters:
          - RestAPIGWVpcLinkEnabled
          - AccessLogsCustomBucketNameEnabled
      - Label:
          default: "NLB Cross Zone support"
        Parameters:
          - NlbCrossZoneEnabled
      - Label:
          default: "VPC Flow Logs"
        Parameters:
          - FlowLogCloudWatchEnabled

###################################
#   Parameters
###################################

Parameters:
  FlowLogCloudWatchEnabled:
    Description: >
      Enable VPC Flow Logs to CloudWatch Logs. When disabled, flow logs will not be created within the account but are centrally collected by Amazon Security Lake. Please contact the PSRE pod for more information.
    Type: "String"
    Default: "No"
    AllowedValues:
      - "Yes"
      - "No"

  VpcType:
    Description: >
      [VPC TYPE-AGNOSTIC]
      Selects the Legacy or Spoke VPC type.
      Spoke VPC allows applications to use the new secure egress service (Transit Gateway).
      Legacy VPC should not be used for new applications and should only be selected for applications
      that have not yet been migrated to Spoke VPC and Transit Gateway.
      The Legacy VPC type will be removed in a future release.
    Type: "String"
    AllowedValues:
      - Legacy
      - Spoke
    Default: Legacy

  Environment:
    Description: >
      [SPOKE VPC ONLY]
      The service environment this VPC is deployed into.
      Determines the IPAM pool for IP address allocation, the Transit Gateway ID, and the Disaster Recovery Transit Gateway ID.
    Type: "String"
    AllowedValues:
      - none
      - demo
      - dev
      - build
      - staging
      - integration
      - production
    Default: none

  DeployEgressTestLambda:
    Description: >
      [SPOKE VPC ONLY]
      Deploy a lambda you can use to confirm egress via the Transit Gateway.
      The lambda will test a set of default URLs, and you can specify custom URLs via the EgressTestLambdaCustomURLs parameter.
    Type: "String"
    Default: "No"
    AllowedValues:
      - "Yes"
      - "No"

  EgressTestLambdaCustomURLs:
    Description: >
      [SPOKE VPC ONLY]
      Specify any custom URLs the egress-test lambda will validate.
      These will be stored as a comma-delimited list under the lambda's CUSTOM_URLS environment variable.
      Include the protocol (e.g. https://)
    Type: "String"
    Default: "none"

  UseDisasterRecovery:
    Description: >
      [SPOKE VPC ONLY]
      *** DO NOT SET THIS TO `Yes` UNLESS RESPONDING TO A DISASTER SCENARIO ***
      Only set to `Yes` when actively responding to a production Transit Gateway hub outage, to
      redirect egress traffic via the Disaster Recovery Transit Gateway hub.
      This is an operational switch for incident response only — it does not enable or configure
      DR capability. It must be returned to `No` once the incident is resolved.
    Type: "String"
    Default: "No"
    AllowedValues:
      - "Yes"
      - "No"

  CidrBlock:
    Description: >
      [LEGACY VPC ONLY]
      The CIDR block that defines the IP range that the VPC will use. Defaults
      to 10.0.0.0/16 and there is no specific reason to change this unless you
      have multiple VPCs that are going to be peered or connected via a Transit
      Gateway. Must be a /16.
    Type: "String"
    AllowedPattern: "([0-9]{1,3}\\.){3}[0-9]{1,3}(\\/16)?"
    Default: "10.0.0.0/16"

  AvailabilityZoneCount:
    Description: >
      [LEGACY VPC ONLY]
      The number of availability zones to configure. It is expected that
      AWS will be more reliable than our application and as such two
      availability zones should be sufficient for the vast majority of use
      cases. The availability zone count will always be 3 for Spoke VPC.
    Type: "Number"
    AllowedValues:
      - 2
      - 3
    Default: 3

  FirewallS3Bucket:
    Description: >
      [LEGACY VPC ONLY]
      The S3 bucket destination for Network Firewall logs
    Type: "String"
    Default: "log-archive-nwf-alerts-logs-523017967436-eu-west-2"

  ZoneAEIPAllocationId:
    Description: >
      [LEGACY VPC ONLY]
      The EIP allocation id to use for the NAT Gateway in Zone A. If not
      specified an EIP will be automatically provisioned.
    Type: "String"
    Default: "none"

  ZoneBEIPAllocationId:
    Description: >
      [LEGACY VPC ONLY]
      The EIP allocation id to use for the NAT Gateway in Zone B. If not
      specified an EIP will be automatically provisioned.
    Type: "String"
    Default: "none"

  ZoneCEIPAllocationId:
    Description: >
      [LEGACY VPC ONLY]
      The EIP allocation id to use for the NAT Gateway in Zone C. If not
      specified an EIP will be automatically provisioned. This will only
      be used if AvailabilityZoneCount is set to 3.
    Type: "String"
    Default: "none"

  VpcLinkEnabled:
    Description: >
      [VPC TYPE-AGNOSTIC]
      Allow a public API gateway to connect to services that are deployed
      in the VPC. This is not required if the API Gateway only connects to
      Lambda functions.
    Type: "String"
    Default: "No"
    AllowedValues:
      - "Yes"
      - "No"

  AllowedDomains:
    Description: >
      [VPC TYPE-AGNOSTIC]
      Allow these domains to be resolved by DNS. If no AllowedDomains are needed,
      input none. Please note: to enable egress, you must fill the AllowedDomains or AllowRules params.
    Type: "CommaDelimitedList"
    Default: "none"
    AllowedPattern: ".+"

  AllowRules:
    Description: >
      [LEGACY VPC ONLY]
      Suricata rules needed to pass traffic. Consecutive sid's are used.
      Please note: to enable egress, you must fill the AllowedDomains or AllowRules params.
      Example rule to allow traffic for all domains under account.gov.uk:
      pass tls $HOME_NET any -> $EXTERNAL_NET 443 (tls.sni;
      content:".account.gov.uk"; endswith; msg:"Pass TLS to *.account.gov.uk";
      flow:established; sid:2001; rev:1;)
    Type: "String"
    Default: "none"

  AdditionalAllowRules:
    Description: >
      [LEGACY VPC ONLY]
      Additional Suricata rules needed to pass traffic. Consecutive sid's are used.
      Please note: to enable egress, you must fill the AllowedDomains or AllowRules params.
      Example rule to allow traffic for all domains under account.gov.uk:
      pass tls $HOME_NET any -> $EXTERNAL_NET 443 (tls.sni;
      content:".account.gov.uk"; endswith; msg:"Pass TLS to *.account.gov.uk";
      flow:established; sid:2001; rev:1;)
      This parameter is for when the maximum length of the AllowRules parameter has been
      reached but more rules are required.
    Type: "String"
    Default: "none"

  AccessLogsCustomBucketNameEnabled:
    Description: >
      [VPC TYPE-AGNOSTIC]
      Controls the AccessLogsBucket BucketName.
      By default (Yes) the AccessLogsBucket is named as {AWS::StackName}-{Pseudo random element from stack id}. This allows the bucket name to be found programatically and avoids naming collisions within the account.
      When set to No the bucket will be named by Cloudformation standard resource naming approach. Please seek guidance from #dev-platform before setting 'No'
    Type: "String"
    Default: "Yes"
    AllowedValues:
      - "Yes"
      - "No"

  NlbCrossZoneEnabled:
    Description: >
      [VPC TYPE-AGNOSTIC]
      This enables NLB Cross-zone load balancing, which can be used to route
      traffic accross the Availability Zones. Default is Yes (enabled)
    Type: "String"
    Default: "Yes"
    AllowedValues:
      - "Yes"
      - "No"

  AppConfigApiEnabled:
    Description: >
      [VPC TYPE-AGNOSTIC]
      The App Config API is enabled. This is only required in stacks where the
      application uses App Config.
    Type: "String"
    Default: "No"
    AllowedValues:
      - "Yes"
      - "No"

  AppConfigDataApiEnabled:
    Description: >
      [VPC TYPE-AGNOSTIC]
      The App Config Data API is enabled. This is only required in stacks where the
      application uses App Config Data.
    Type: "String"
    Default: "No"
    AllowedValues:
      - "Yes"
      - "No"

  AthenaApiEnabled:
    Description: >
      [VPC TYPE-AGNOSTIC]
      The Athena API is enabled. This is only required in stacks where the
      application uses Athena as a data engine.
    Type: "String"
    Default: "No"
    AllowedValues:
      - "Yes"
      - "No"

  BatchApiEnabled:
    Description: >
      [VPC TYPE-AGNOSTIC]
      The AWS Batch API is enabled. Only enable if you require access to the
      fully managed batch computing service.
    Type: "String"
    Default: "No"
    AllowedValues:
      - "Yes"
      - "No"

  CloudFormationEndpointEnabled:
    Description: >
      [VPC TYPE-AGNOSTIC]
      This provisions a cloudformation VPC Endpoint, which may be needed when either
      using custom resources or wait conditions.
    Type: "String"
    Default: "No"
    AllowedValues:
      - "Yes"
      - "No"

  CloudTrailApiEnabled:
    Description: >
      [VPC TYPE-AGNOSTIC]
      The Cloud Trail API is enabled. This is required for lambdas that will
      make Cloud Trail queries, retrieve results and interact with other
      features of the service.
    Type: "String"
    Default: "No"
    AllowedValues:
      - "Yes"
      - "No"

  CloudWatchApiEnabled:
    Description: >
      [VPC TYPE-AGNOSTIC]
      The CloudWatch Metrics API is enabled. This is only required in stacks
      where applications explicitly emit metrics using the PutMetricData API
      call (rather than using the logs embedded metric format) or perform a
      Canary-style release by setting a DeploymentPreference on a Lambda.
    Type: "String"
    Default: "No"
    AllowedValues:
      - "Yes"
      - "No"

  CloudWatchLogsApiEnabled:
    Description: >
      [VPC TYPE-AGNOSTIC]
      The CloudWatch Logs API is enabled. This is only required in stacks
      where applications explicitly emit or query Cloudwatch logs.
    Type: "String"
    Default: "No"
    AllowedValues:
      - "Yes"
      - "No"

  CodeBuildApiEnabled:
    Description: >
      [VPC TYPE-AGNOSTIC]
      The CodeBuild API is enabled.  This is only required for stacks who
      use CodeBuild within their VPC and know it's required for executing
      certain API calls.
    Type: "String"
    Default: "No"
    AllowedValues:
      - "Yes"
      - "No"

  CodeDeployApiEnabled:
    Description: >
      [VPC TYPE-AGNOSTIC]
      The Code Deploy API is enabled. This is only required in stacks that perform a
      Canary-style release by setting a DeploymentPreference on a Lambda. It
      allows the Lambda runtime to update the hook execution status in the associated
      Deployment Group.
    Type: "String"
    Default: "No"
    AllowedValues:
      - "Yes"
      - "No"

  DynamoDBApiEnabled:
    Description: >
      [VPC TYPE-AGNOSTIC]
      The DynamoDB API is enabled. This is only required in stacks where the
      application uses DynamoDB as a data store.
    Type: "String"
    Default: "No"
    AllowedValues:
      - "Yes"
      - "No"

  DynatraceApiEnabled:
    Description: >
      [VPC TYPE-AGNOSTIC]
      The Dynatrace API is enabled. This is only required in stacks
      where applications explicitly emit or query Dynatrace.
    Type: "String"
    Default: "No"
    AllowedValues:
      - "Yes"
      - "No"

  EventsApiEnabled:
    Description: >
      [VPC TYPE-AGNOSTIC]
      The Events API is enabled. This is only required in stacks where the
      application processes event bridge events.
    Type: "String"
    Default: "No"
    AllowedValues:
      - "Yes"
      - "No"

  ECRApiEnabled:
    Description: >
      [VPC TYPE-AGNOSTIC]
      The Elastic Container Registry (ECR) API is enabled. This is only required in
      stacks that deploy containers to Fargate.
    Type: "String"
    Default: "No"
    AllowedValues:
      - "Yes"
      - "No"

  ExecuteApiGatewayEnabled:
    Description: >
      [VPC TYPE-AGNOSTIC]
      The Execute API is enabled. This is only required in stacks that use private REST APIs,
      with private dns enabled. More information available at
      'https://docs.aws.amazon.com/apigateway/latest/developerguide/apigateway-private-apis.html'
    Type: "String"
    Default: "No"
    AllowedValues:
      - "Yes"
      - "No"

  FirehoseApiEnabled:
    Description: >
      [VPC TYPE-AGNOSTIC]
      The Kinesis Firehose API is enabled. This is only required in stacks where the
      application directly writes records to a Kinesis Firehose. It is not required
      if there is a separate process that runs outside the VPC that streams data to
      the Firehose.
    Type: "String"
    Default: "No"
    AllowedValues:
      - "Yes"
      - "No"

  GlueApiEnabled:
    Description: >
      [VPC TYPE-AGNOSTIC]
      The Glue API is enabled. Only enable if you require access to the
      Glue serverless data integration service.
    Type: "String"
    Default: "No"
    AllowedValues:
      - "Yes"
      - "No"

  IdentityStoreApiEnabled:
    Description: >
      [VPC TYPE-AGNOSTIC]
      The Identity Store API service is enabled.
      This is endpoint required specifically for the T.E.A.M application:
      'https://govukverify.atlassian.net/wiki/x/Xo_T5'
      IMPORTANT: it is not recommended that you enable this unless deploying
      for use with T.E.A.M
    Type: "String"
    Default: "No"
    AllowedValues:
      - "Yes"
      - "No"

  KinesisApiEnabled:
    Description: >
      [VPC TYPE-AGNOSTIC]
      The Kinesis API is enabled. This is only required in stacks where the
      application uses Kinesis streams.
    Type: "String"
    Default: "No"
    AllowedValues:
      - "Yes"
      - "No"

  KMSApiEnabled:
    Description: >
      [VPC TYPE-AGNOSTIC]
      The AWS Key Management Service (KMS) is enabled. This should be enabled
      in most stacks as most event sources and targets should be using KMS to
      encrypt data at rest.
    Type: "String"
    Default: "No"
    AllowedValues:
      - "Yes"
      - "No"

  LambdaApiEnabled:
    Description: >
      [VPC TYPE-AGNOSTIC]
      The Lambda API is enabled. This is only required in stacks that either
      directly invoke a Lambda using the AWS API or perform a
      Canary-style release by setting a DeploymentPreference on a Lambda. It
      allows the Lambda runtime to invoke the associate hook functions.
    Type: "String"
    Default: "No"
    AllowedValues:
      - "Yes"
      - "No"

  LogsApiEnabled:
    Description: >
      [LEGACY VPC ONLY]
      The CloudWatch Logs API is enabled. This is not required for a Lambda
      to emit logging events by writing to standard output. This is required
      if the Lambda explicitly writes logs to a log group or for container
      logging.
    Type: "String"
    Default: "No"
    AllowedValues:
      - "Yes"
      - "No"

  PrivateCAApiEnabled:
    Description: >
      [VPC TYPE-AGNOSTIC]
      The Private Certificate Authority is enabled. This is only required for
      services hosted in private subnets to access a Private CA.
    Type: "String"
    Default: "No"
    AllowedValues:
      - "Yes"
      - "No"

  RestAPIGWVpcLinkEnabled:
    Description: >
      [VPC TYPE-AGNOSTIC]
      This provisions resources required to create a WAF in the Fargate stacks.
      To be compatible with WAF you need a Network Load Balancer, and a REST API gateway.
      They rely on having a VPC link to the Application Load Balancer.
    Type: "String"
    Default: "No"
    AllowedValues:
      - "Yes"
      - "No"

  S3ApiEnabled:
    Description: >
      [VPC TYPE-AGNOSTIC]
      The S3 API is enabled. This is only required in stacks where the
      application uses S3 as a data store.
    Type: "String"
    Default: "No"
    AllowedValues:
      - "Yes"
      - "No"

  SecretsManagerApiEnabled:
    Description: >
      [VPC TYPE-AGNOSTIC]
      The AWS SecretsManager API is enabled. This is only required in stacks
      that read secret values from secrets manager.
    Type: "String"
    Default: "No"
    AllowedValues:
      - "Yes"
      - "No"

  SESSmtpEnabled:
    Description: >
      [VPC TYPE-AGNOSTIC]
      This provisions a Simple Email Service (SES) Endpoint, which can be used to send e-mail
    Type: "String"
    Default: "No"
    AllowedValues:
      - "Yes"
      - "No"

  SNSApiEnabled:
    Description: >
      [VPC TYPE-AGNOSTIC]
      The SNS API is enabled. This is only required in stacks where the
      application uses SNS topics.
    Type: "String"
    Default: "No"
    AllowedValues:
      - "Yes"
      - "No"

  SQSApiEnabled:
    Description: >
      [VPC TYPE-AGNOSTIC]
      The SQS API is enabled. This is only required in stacks where the
      application uses SQS queues.
    Type: "String"
    Default: "No"
    AllowedValues:
      - "Yes"
      - "No"

  STSApiEnabled:
    Description: >
      [VPC TYPE-AGNOSTIC]
      This provisions a Security Token Service (STS) Endpoint, which can be used to request
      temporary credentials
    Type: "String"
    Default: "No"
    AllowedValues:
      - "Yes"
      - "No"

  SSMApiEnabled:
    Description: >
      [VPC TYPE-AGNOSTIC]
      The AWS SSM API is enabled. This is required for applications to read
      values from the SSM parameter store.
    Type: "String"
    Default: "No"
    AllowedValues:
      - "Yes"
      - "No"

  SSMParametersStoreEnabled:
    Description: >
      [VPC TYPE-AGNOSTIC]
      Store VPC Id, Subnet Id's and the Vpc Link Id into SSM Parameter store to
      be accessed where import function is not supported. This is required by
      templates using blue/green hook deployments.
    Type: "String"
    Default: "No"
    AllowedValues:
      - "Yes"
      - "No"

  StatesApiEnabled:
    Description: >
      [VPC TYPE-AGNOSTIC]
      The States API is enabled. This is only required in stacks which make
      use of Step Functions.
    Type: "String"
    Default: "No"
    AllowedValues:
      - "Yes"
      - "No"

  TextractApiEnabled:
    Description: >
      [VPC TYPE-AGNOSTIC]
      The Textract API is enabled. This is only required in stacks that use the Amazon
      Textract service.
    Type: "String"
    Default: "No"
    AllowedValues:
      - "Yes"
      - "No"

  XRayApiEnabled:
    Description: >
      [VPC TYPE-AGNOSTIC]
      The AWS X-Ray API is enabled. This is not required for a Lambda to emit
      Trace events via the X-Ray daemon (e.g. by using Lambda Powertools). It
      is only required is the Lambda makes explicit calls to the X-Ray API or
      for containers to emit Trace events.
    Type: "String"
    Default: "No"
    AllowedValues:
      - "Yes"
      - "No"

  VpcPeeringConnectionId:
    Description: >
      [VPC TYPE-AGNOSTIC]
      Created for the Orch/Auth Secure Pipelines migration to allow for cross-account DynamoDB access.
      The ID of an existing VPC peering connection.
      WARNING: peering connection must exist beforehand. this is not a bootstrap parameter
    Type: "String"
    Default: "none"

  VpcPeeringRequesterCidr:
    Description: >
      [VPC TYPE-AGNOSTIC]
      Created for the Orch/Auth Secure Pipelines migration to allow for cross-account DynamoDB access.
      The IPv4 CIDR address block of the other VPC of an existing VPC peering connection.
      WARNING: peering connection must exist beforehand. this is not a bootstrap parameter
    Type: "String"
    Default: "none"

###################################
#   Rules
###################################

Rules:

  #--- Validate supported parameter usage for Legacy VPC ---#

  LegacyVpcCannotUseDeployEgressTestLambda:
    RuleCondition:
      Fn::Equals:
        - !Ref VpcType
        - Legacy
    Assertions:
      - Assert:
          Fn::Equals:
            - !Ref DeployEgressTestLambda
            - "No"
        AssertDescription: |
          DeployEgressTestLambda is a Spoke VPC parameter. The egress test lambda
          validates Transit Gateway connectivity which is not available
          in Legacy VPCs. Set DeployEgressTestLambda to 'No' or switch VpcType to Spoke.
      - Assert:
          Fn::Equals:
            - !Ref EgressTestLambdaCustomURLs
            - "none"
        AssertDescription: |
          EgressTestLambdaCustomURLs is a Spoke VPC parameter. It requires DeployEgressTestLambda
          to validate custom URL reachability via Transit Gateway. Since this is only
          supported for Spoke VPCs, set the value to 'none' or change VpcType to Spoke.

  LegacyVpcCannotUseDisasterRecovery:
    RuleCondition:
      Fn::Equals:
        - !Ref VpcType
        - Legacy
    Assertions:
      - Assert:
          Fn::Equals:
            - !Ref UseDisasterRecovery
            - "No"
        AssertDescription: |
          UseDisasterRecovery is a Spoke VPC parameter. Disaster Recovery
          routing is only available for Spoke VPCs. Set to 'No' or switch
          VpcType to Spoke.

  LegacyRequireAllowRulesBeforeAdditionalAllowRules:
    RuleCondition:
      Fn::And:
        - Fn::Equals:
            - !Ref VpcType
            - Legacy
        - Fn::Not:
            - Fn::Or:
                - Fn::Equals:
                    - !Ref AdditionalAllowRules
                    - ''
                - Fn::Equals:
                    - !Ref AdditionalAllowRules
                    - "none"
    Assertions:
      - Assert:
          Fn::Not:
            - Fn::Or:
                - Fn::Equals:
                    - !Ref AllowRules
                    - ''
                - Fn::Equals:
                    - !Ref AllowRules
                    - "none"
        AssertDescription: |
          The 'AllowRules' parameter must be populated before 'AdditionalAllowRules'
          can be used.

  LegacyVpcCannotUseEnvironment:
    RuleCondition:
      Fn::Equals:
        - !Ref VpcType
        - Legacy
    Assertions:
      - Assert:
          Fn::Equals:
            - !Ref Environment
            - "none"
        AssertDescription: |
          Environment is a Spoke VPC parameter and cannot be used with Legacy VPC deployments.
          Leave Environment as 'none' or switch VpcType to Spoke.

  #--- Validate supported parameter usage for Spoke VPC ---#


  SpokeVpcRequiresEnvironment:
    RuleCondition:
      Fn::Equals:
        - !Ref VpcType
        - Spoke
    Assertions:
      - Assert:
          Fn::Not:
            - Fn::Equals:
                - !Ref Environment
                - "none"
        AssertDescription: |
          Environment is required for Spoke VPC deployments.
          Specify one of: demo, dev, build, staging, integration, production.


  SpokeVpcCannotUseCidrBlock:
    RuleCondition:
      Fn::Equals:
        - !Ref VpcType
        - Spoke
    Assertions:
      - Assert:
          Fn::Equals:
            - !Ref CidrBlock
            - "10.0.0.0/16"
        AssertDescription: |
          CidrBlock cannot be customised for Spoke VPC deployments.
          Spoke VPCs obtain their CIDR from IPAM. Leave CidrBlock at
          the default value or switch VpcType to Legacy.

  SpokeVpcCannotAmendAvailabilityZoneCount:
    RuleCondition:
      Fn::Equals:
        - !Ref VpcType
        - Spoke
    Assertions:
      - Assert:
          Fn::Equals:
            - !Ref AvailabilityZoneCount
            - "3"
        AssertDescription: |
          AvailabilityZoneCount must be 3 for Spoke VPC deployments.
          Spoke VPCs always deploy across 3 availability zones. Set
          AvailabilityZoneCount to 3 or switch VpcType to Legacy.

  SpokeVpcCannotUseFirewallS3Bucket:
    RuleCondition:
      Fn::Equals:
        - !Ref VpcType
        - Spoke
    Assertions:
      - Assert:
          Fn::Equals:
            - !Ref FirewallS3Bucket
            - "log-archive-nwf-alerts-logs-523017967436-eu-west-2"
        AssertDescription: |
          FirewallS3Bucket is a Legacy VPC parameter and cannot be used
          with Spoke VPC deployments. Spoke VPCs use a central Network
          Firewall configuration. Leave FirewallS3Bucket at the default
          value or switch VpcType to Legacy.

  SpokeVpcCannotUseEIPAllocationIds:
    RuleCondition:
      Fn::Equals:
        - !Ref VpcType
        - Spoke
    Assertions:
      - Assert:
          Fn::Equals:
            - !Ref ZoneAEIPAllocationId
            - "none"
        AssertDescription: |
          ZoneAEIPAllocationId is a Legacy VPC parameter. Spoke VPCs do
          not provision NAT Gateways or EIPs. Leave ZoneAEIPAllocationId
          as 'none' or switch VpcType to Legacy.
      - Assert:
          Fn::Equals:
            - !Ref ZoneBEIPAllocationId
            - "none"
        AssertDescription: |
          ZoneBEIPAllocationId is a Legacy VPC parameter. Spoke VPCs do
          not provision NAT Gateways or EIPs. Leave ZoneBEIPAllocationId
          as 'none' or switch VpcType to Legacy.
      - Assert:
          Fn::Equals:
            - !Ref ZoneCEIPAllocationId
            - "none"
        AssertDescription: |
          ZoneCEIPAllocationId is a Legacy VPC parameter. Spoke VPCs do
          not provision NAT Gateways or EIPs. Leave ZoneCEIPAllocationId
          as 'none' or switch VpcType to Legacy.

  SpokeVpcCannotUseAllowRules:
    RuleCondition:
      Fn::Equals:
        - !Ref VpcType
        - Spoke
    Assertions:
      - Assert:
          Fn::Equals:
            - !Ref AllowRules
            - "none"
        AssertDescription: |
          AllowRules is a Legacy VPC parameter. Spoke VPCs use a central
          Network Firewall configuration and do not support custom Suricata
          rules. Leave AllowRules empty or switch VpcType to Legacy.

  SpokeVpcCannotUseLogsApi:
    RuleCondition:
      Fn::Equals:
        - !Ref VpcType
        - Spoke
    Assertions:
      - Assert:
          Fn::Equals:
            - !Ref LogsApiEnabled
            - "No"
        AssertDescription: |
          LogsApiEnabled is a Legacy VPC parameter. The LogsApiEnabled
          endpoint is not provisioned for Spoke VPCs. For Spoke VPCs set
          LogsApiEnabled to 'No' and use CloudWatchLogsApiEnabled instead
          if CloudWatch Logs access is needed, or switch VpcType to Legacy.


###################################
#   Conditions
###################################

Conditions:
  IsLegacyVpc:
    Fn::Equals:
      - !Ref VpcType
      - Legacy

  IsSpokeVpc:
    Fn::Equals:
      - !Ref VpcType
      - Spoke

  AccessLogsCustomBucketName:
    Fn::Equals:
      - !Ref AccessLogsCustomBucketNameEnabled
      - "Yes"

  ProvisionAvailabilityZoneC:
    Fn::Or:
      - Condition: IsSpokeVpc
      - Condition: LegacyProvisionAvailabilityZoneC

  LegacyProvisionAvailabilityZoneC:
    Fn::And:
      - Condition: IsLegacyVpc
      - Fn::Equals:
        - !Ref AvailabilityZoneCount
        - 3

  LegacyProvisionRouteThroughVpcPeering:
    Fn::And:
      - Condition: IsLegacyVpc
      - Fn::Not:
        - Fn::Equals:
          - !Ref VpcPeeringConnectionId
          - "none"
      - Fn::Not:
        - Fn::Equals:
          - !Ref VpcPeeringRequesterCidr
          - "none"

  LegacyProvisionRouteThroughVpcPeeringZoneC:
    Fn::And:
      - Condition: LegacyProvisionAvailabilityZoneC
      - Condition: LegacyProvisionRouteThroughVpcPeering

  SpokeProvisionRouteThroughVpcPeering:
    Fn::And:
      - Condition: IsSpokeVpc
      - Fn::Not:
        - Fn::Equals:
          - !Ref VpcPeeringConnectionId
          - "none"
      - Fn::Not:
        - Fn::Equals:
          - !Ref VpcPeeringRequesterCidr
          - "none"

  ProvisionAllowedDomainsList:
    Fn::Not:
      - Fn::Equals:
        - !Join ['', !Ref AllowedDomains]
        - "none"

  ProvisionAllowRulesList:
    Fn::Not:
      - Fn::Or:
        - Fn::Equals:
          - !Ref AllowRules
          - ""
        - Fn::Equals:
          - !Ref AllowRules
          - "none"

  ProvisionAdditionalAllowRulesList:
    Fn::Not:
      - Fn::Or:
        - Fn::Equals:
          - !Ref AdditionalAllowRules
          - ""
        - Fn::Equals:
          - !Ref AdditionalAllowRules
          - "none"

  ProvisionOutboundInternet:
    Fn::Or:
      - Condition: LegacyProvisionOutboundInternet
      - Condition: SpokeProvisionOutboundInternet

  LegacyProvisionOutboundInternet:
    Fn::And:
      - Condition: IsLegacyVpc
      - Fn::Or:
        - Condition: ProvisionAllowedDomainsList
        - Condition: ProvisionAllowRulesList

  SpokeProvisionOutboundInternet:
    Fn::And:
      - Condition: IsSpokeVpc
      - Condition: ProvisionAllowedDomainsList

  ProvisionOutboundInternetInZoneC:
    Fn::Or:
      - Condition: LegacyProvisionOutboundInternetInZoneC
      - Condition: SpokeProvisionOutboundInternet

  LegacyProvisionOutboundInternetInZoneC:
    Fn::And:
      - Condition: LegacyProvisionAvailabilityZoneC
      - Condition: LegacyProvisionOutboundInternet

  SpokeProvisionEgressTestResources:
    Fn::And:
      - Condition: IsSpokeVpc
      - Fn::Equals:
        - !Ref DeployEgressTestLambda
        - "Yes"

  LegacyProvisionZoneAElasticIP:
    Fn::And:
      - Condition: LegacyProvisionOutboundInternet
      - Fn::Equals:
        - !Ref ZoneAEIPAllocationId
        - "none"

  LegacyProvisionZoneBElasticIP:
    Fn::And:
      - Condition: LegacyProvisionOutboundInternet
      - Fn::Equals:
        - !Ref ZoneBEIPAllocationId
        - "none"

  LegacyProvisionZoneCElasticIP:
    Fn::And:
      - Condition: LegacyProvisionOutboundInternetInZoneC
      - Fn::Equals:
        - !Ref ZoneCEIPAllocationId
        - "none"

  ProvisionVpcLink:
    Fn::Equals:
      - !Ref VpcLinkEnabled
      - "Yes"

  ProvisionRestAPIGWVpcLink:
    Fn::Equals:
      - !Ref RestAPIGWVpcLinkEnabled
      - "Yes"

  ProvisionAppConfigVPCEndpoint:
    Fn::Equals:
      - !Ref AppConfigApiEnabled
      - "Yes"

  ProvisionAppConfigDataVPCEndpoint:
    Fn::Equals:
      - !Ref AppConfigDataApiEnabled
      - "Yes"

  ProvisionIdentityStoreVPCEndpoint:
    Fn::Equals:
      - !Ref IdentityStoreApiEnabled
      - "Yes"

  ProvisionCloudTrailVPCEndpoint:
    Fn::Equals:
      - !Ref CloudTrailApiEnabled
      - "Yes"

  ProvisionCloudFormationEndpoint:
    Fn::Equals:
      - !Ref CloudFormationEndpointEnabled
      - "Yes"

  LegacyProvisionLogsVPCEndpoint:
    Fn::And:
      - Condition: IsLegacyVpc
      - Fn::Equals:
        - !Ref LogsApiEnabled
        - "Yes"

  ProvisionPrivateCAVPCEndpoint:
    Fn::Equals:
      - !Ref PrivateCAApiEnabled
      - "Yes"

  ProvisionBatchVPCEndpoint:
    Fn::Equals:
      - !Ref BatchApiEnabled
      - "Yes"

  ProvisionGlueVPCEndpoint:
    Fn::Equals:
      - !Ref GlueApiEnabled
      - "Yes"

  ProvisionCodeBuildVPCEndpoint:
    Fn::Equals:
      - !Ref CodeBuildApiEnabled
      - "Yes"

  ProvisionCloudWatchVPCEndpoint:
    Fn::Equals:
      - !Ref CloudWatchApiEnabled
      - "Yes"

  ProvisionCloudWatchLogsVPCEndpoint:
    Fn::Equals:
      - !Ref CloudWatchLogsApiEnabled
      - "Yes"

  ProvisionDynatraceVPCEndpoint:
    Fn::Equals:
      - !Ref DynatraceApiEnabled
      - "Yes"

  ProvisionXRayVPCEndpoint:
    Fn::Equals:
      - !Ref XRayApiEnabled
      - "Yes"

  ProvisionSSMVPCEndpoint:
    Fn::Equals:
      - !Ref SSMApiEnabled
      - "Yes"

  ProvisionSecretsManagerVPCEndpoint:
    Fn::Equals:
      - !Ref SecretsManagerApiEnabled
      - "Yes"

  ProvisionKMSVPCEndpoint:
    Fn::Equals:
      - !Ref KMSApiEnabled
      - "Yes"

  ProvisionDynamoDBVPCEndpoint:
    Fn::Equals:
      - !Ref DynamoDBApiEnabled
      - "Yes"

  ProvisionAthenaVPCEndpoint:
    Fn::Equals:
      - !Ref AthenaApiEnabled
      - "Yes"

  ProvisionS3VPCEndpoint:
    Fn::Or:
      - Fn::Equals:
        - !Ref S3ApiEnabled
        - "Yes"
      - Fn::Equals:
        - !Ref ECRApiEnabled
        - "Yes"
      - Fn::Equals:
        - !Ref CloudFormationEndpointEnabled
        - "Yes"

  ProvisionSQSVPCEndpoint:
    Fn::Equals:
      - !Ref SQSApiEnabled
      - "Yes"

  ProvisionSNSVPCEndpoint:
    Fn::Equals:
      - !Ref SNSApiEnabled
      - "Yes"

  ProvisionKinesisVPCEndpoint:
    Fn::Equals:
      - !Ref KinesisApiEnabled
      - "Yes"

  ProvisionFirehoseVPCEndpoint:
    Fn::Equals:
      - !Ref FirehoseApiEnabled
      - "Yes"

  ProvisionEventsVPCEndpoint:
    Fn::Equals:
      - !Ref EventsApiEnabled
      - "Yes"

  ProvisionStatesVPCEndpoint:
    Fn::Equals:
      - !Ref StatesApiEnabled
      - "Yes"

  ProvisionECRVPCEndpoint:
    Fn::Equals:
      - !Ref ECRApiEnabled
      - "Yes"

  ProvisionLambdaVPCEndpoint:
    Fn::Equals:
      - !Ref LambdaApiEnabled
      - "Yes"

  ProvisionCodeDeployVPCEndpoint:
    Fn::Equals:
      - !Ref CodeDeployApiEnabled
      - "Yes"

  ProvisionExecuteApiGatewayVPCEndpoint:
    Fn::Equals:
      - !Ref ExecuteApiGatewayEnabled
      - "Yes"

  ProvisionTextractVPCEndpoint:
    Fn::Equals:
      - !Ref TextractApiEnabled
      - "Yes"

  ProvisionSESSmtpVPCEndpoint:
    Fn::Equals:
      - !Ref SESSmtpEnabled
      - "Yes"

  ProvisionSTSVPCEndpoint:
    Fn::Equals:
      - !Ref STSApiEnabled
      - "Yes"

  SSMParametersStoreEnabled:
    Fn::Equals:
      - !Ref SSMParametersStoreEnabled
      - "Yes"

  CreateSSMParametersForZoneCSubnetIds:
    Fn::And:
      - Condition: ProvisionAvailabilityZoneC
      - Condition: SSMParametersStoreEnabled

  CreateSSMParameterForVpcLinkId:
    Fn::And:
      - Condition: ProvisionVpcLink
      - Condition: SSMParametersStoreEnabled

  CreateSSMParameterForApiGatewayVpcLinkId:
    Fn::And:
      - Condition: ProvisionRestAPIGWVpcLink
      - Condition: SSMParametersStoreEnabled

  LegacyCreateSSMParameterForZoneAElasticIP:
    Fn::And:
      - Condition: LegacyProvisionZoneAElasticIP
      - Condition: SSMParametersStoreEnabled

  LegacyCreateSSMParameterForZoneBElasticIP:
    Fn::And:
      - Condition: LegacyProvisionZoneBElasticIP
      - Condition: SSMParametersStoreEnabled

  LegacyCreateSSMParameterForZoneCElasticIP:
    Fn::And:
      - Condition: LegacyProvisionZoneCElasticIP
      - Condition: SSMParametersStoreEnabled

  CreateSSMParameterForExecuteApiGatewayVpcEndpointId:
    Fn::And:
      - Condition: ProvisionExecuteApiGatewayVPCEndpoint
      - Condition: SSMParametersStoreEnabled

  ProvisionNlbCrossZone:
    Fn::Equals:
      - !Ref NlbCrossZoneEnabled
      - "Yes"

  SpokeProvisionDisasterRecoveryTransitGatewayAttachment:
    Fn::And:
      - Condition: SpokeProvisionOutboundInternet
      - Fn::Not:
        - Fn::Equals:
          - Fn::FindInMap:
              - EnvironmentConfiguration
              - !Ref Environment
              - DisasterRecoveryTransitGatewayId
              - DefaultValue: none
          - none

  SpokeUseDisasterRecoveryTransitGateway:
    Fn::And:
      - Condition: SpokeProvisionDisasterRecoveryTransitGatewayAttachment
      - Fn::Equals:
        - !Ref UseDisasterRecovery
        - "Yes"

  ProvisionFlowLogCloudWatch:
    Fn::Equals:
      - !Ref FlowLogCloudWatchEnabled
      - "Yes"

