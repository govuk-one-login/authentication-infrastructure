    Condition: ProvisionDynatraceVPCEndpoint
    Properties:
      HostedZoneId: !Ref DynatraceHostedZoneNonProd
      Name: "khw46367.live.dynatrace.com."
      Type: A
      AliasTarget:
        DNSName: !Select ['1', !Split [':', !Select ['0', !GetAtt DynatraceApiEndpoint.DnsEntries]]]
