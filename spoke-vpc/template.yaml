  #
  # Network Firewall
  #

  NetworkFirewall:
    Type: AWS::NetworkFirewall::Firewall
    Condition: LegacyProvisionOutboundInternet
    Properties:
      FirewallName: !Sub "${AWS::StackName}-Firewall"
      SubnetMappings:
        - SubnetId: !Ref FirewallSubnetA
        - SubnetId: !Ref FirewallSubnetB
        - !If
          - LegacyProvisionOutboundInternetInZoneC
          - SubnetId: !Ref FirewallSubnetC
          - !Ref AWS::NoValue
      FirewallPolicyArn: !Ref NetworkFirewallOnlyAllowSpecifiedDomainsPolicy
      VpcId: !Ref Vpc
      Tags:
        - Key: "Name"
          Value: !Sub "${AWS::StackName}-NetworkFirewall"
        - Key: "Service"
          Value: "ci/cd"
        - Key: "Source"
          Value: "govuk-one-login/devplatform-deploy/vpc/template.yaml"

  NetworkFirewallOnlyAllowSpecifiedDomainsPolicy:
    Type: AWS::NetworkFirewall::FirewallPolicy
    Condition: LegacyProvisionOutboundInternet
    Properties:
      FirewallPolicyName: !Sub "${AWS::StackName}-OnlyAllowSpecifiedDomainsPolicy"
      FirewallPolicy:
        StatefulEngineOptions:
          RuleOrder: STRICT_ORDER
        StatefulDefaultActions:
          - "aws:drop_established"
        StatelessDefaultActions:
          - "aws:forward_to_sfe"
        StatelessFragmentDefaultActions:
          - "aws:forward_to_sfe"
        StatefulRuleGroupReferences:
          - ResourceArn: !Ref NetworkFirewallAllowSpecifiedDomainsRuleGroup
            Priority: 10
      Tags:
        - Key: "Name"
          Value: !Sub "${AWS::StackName}-OnlyAllowSpecifiedDomainsPolicy"
        - Key: "Service"
          Value: "ci/cd"
        - Key: "Source"
          Value: "govuk-one-login/devplatform-deploy/vpc/template.yaml"

  NetworkFirewallAllowSpecifiedDomainsRuleGroup:
    Type: AWS::NetworkFirewall::RuleGroup
    Condition: LegacyProvisionOutboundInternet
    Properties:
      Type: STATEFUL
      Capacity: 1000
      RuleGroupName: !Sub "${AWS::StackName}-AllowSpecifiedDomains"
      RuleGroup:
        RuleVariables:
          IPSets:
            HOME_NET:
              Definition:
                - !Ref CidrBlock
        RulesSource:
          RulesString: !Sub
            - '# Allow TCP connection to be established
                # sid starting 1001


                pass tcp $HOME_NET any <> $EXTERNAL_NET 443 (flow:not_established; sid:1001;
                rev:1;)

                # Default allowed TLS connections

                pass tls $HOME_NET any -> $EXTERNAL_NET 443 (tls.sni; content:".account.gov.uk"; endswith; msg:"Pass TLS to *.account.gov.uk"; flow:established; sid:1002; rev:1;)

                pass tls $HOME_NET any -> $EXTERNAL_NET 443 (tls.sni; content:".live.dynatrace.com"; endswith; msg:"Pass TLS to *.live.dynatrace.com"; flow:established; sid:1003; rev:1;)

                # Custom allow lists added by developer

                # sid starting 2001

                ${AllowRules}

                ${AdditionalAllowRules}

                # Firewall is strict order, with default action of dropping packets - all other
                traffic is dropped


                '
            - AllowRules: !If [ProvisionAllowRulesList, !Ref AllowRules, ""]
              AdditionalAllowRules: !If [ProvisionAdditionalAllowRulesList, !Ref AdditionalAllowRules, ""]
        StatefulRuleOptions:
          RuleOrder: STRICT_ORDER
      Tags:
        - Key: "Name"
          Value: !Sub "${AWS::StackName}-AllowSpecifiedDomains"
        - Key: "Service"
          Value: "ci/cd"
        - Key: "Source"
          Value: "govuk-one-login/devplatform-deploy/vpc/template.yaml"

  NetworkFirewallLambdaENILogGroup:
    Type: AWS::Logs::LogGroup
    Condition: LegacyProvisionOutboundInternet
    Properties:
      LogGroupName:
        !Sub '/aws/lambda/${AWS::StackName}-NetworkFirewallLambdaENI'
      RetentionInDays: 30
      KmsKeyId: !GetAtt LoggingKmsKey.Arn

  NetworkFirewallLambdaENIPolicy:
    Type: AWS::IAM::ManagedPolicy
    Condition: LegacyProvisionOutboundInternet
    Properties:
      ManagedPolicyName:
        Fn::Join:
          - "-"
          - - !Ref AWS::StackName
            - "NetworkFirewallLambdaENIPolicy"
            - Fn::Select:
                - 4
                - Fn::Split:
                    - "-"
                    - Fn::Select:
                        - 2
                        - Fn::Split:
                            - "/"
                            - Ref: AWS::StackId
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: "Allow"
            Action:
              - "network-firewall:DescribeFirewall"
            Resource:
              - !Ref NetworkFirewall

  NetworkFirewallLambdaENI:
    Type: AWS::Serverless::Function
    Condition: LegacyProvisionOutboundInternet
    Properties:
      # checkov:skip=CKV_AWS_116: DLQ not required
      # checkov:skip=CKV_AWS_117: Internet access not required
      FunctionName: !Select [3, !Split ["/", !Ref NetworkFirewallLambdaENILogGroup]]
      ReservedConcurrentExecutions: 5
      CodeUri: network-firewall-eni/src
      Handler: app.lambda_handler
      Runtime: "python3.13"
      Timeout: 120
      Policies:
        - AWSLambdaBasicExecutionRole
        - !Ref NetworkFirewallLambdaENIPolicy
      Tags:
        CheckovRulesToSkip: CKV_AWS_116.CKV_AWS_117
        Name: !Select [3, !Split ["/", !Ref NetworkFirewallLambdaENILogGroup]]
        Service: "ci/cd"
        Source: "govuk-one-login/devplatform-deploy/vpc/template.yaml"

  NetworkFirewallENIZoneA:
    Type: AWS::CloudFormation::CustomResource
    Condition: LegacyProvisionOutboundInternet
    Properties:
      ServiceToken: !GetAtt NetworkFirewallLambdaENI.Arn
      SubnetId: !Ref FirewallSubnetA
      FirewallArn: !Ref NetworkFirewall

  NetworkFirewallENIZoneB:
    Type: AWS::CloudFormation::CustomResource
    Condition: LegacyProvisionOutboundInternet
    Properties:
      ServiceToken: !GetAtt NetworkFirewallLambdaENI.Arn
      SubnetId: !Ref FirewallSubnetB
      FirewallArn: !Ref NetworkFirewall

  NetworkFirewallENIZoneC:
    Type: AWS::CloudFormation::CustomResource
    Condition: LegacyProvisionOutboundInternetInZoneC
    Properties:
      ServiceToken: !GetAtt NetworkFirewallLambdaENI.Arn
      SubnetId: !Ref FirewallSubnetC
      FirewallArn: !Ref NetworkFirewall

  NetworkFirewallLogging:
    Type: AWS::NetworkFirewall::LoggingConfiguration
    Condition: LegacyProvisionOutboundInternet
    Properties:
      FirewallArn: !Ref NetworkFirewall
      LoggingConfiguration:
        LogDestinationConfigs:
          - LogType: "ALERT"
            LogDestinationType: S3
            LogDestination:
              bucketName: !Ref FirewallS3Bucket

  # The following resource is deprecated
  # Network Firewall logs are now stored in central bucket log-archive-nwf-alerts-logs-523017967436-eu-west-2
  # To be removed once all teams migrate to v2.6.0+
  NetworkFirewallAlertsLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: IsLegacyVpc
    Properties:
      LogGroupName: !Sub "/aws/vendedlogs/${AWS::StackName}-firewall-alerts"
      RetentionInDays: 30
      KmsKeyId: !GetAtt LoggingKmsKey.Arn
