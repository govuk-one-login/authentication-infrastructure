AWSTemplateFormatVersion: "2010-09-09"

Description: >
  Apex CloudFront certificate with manual DNS validation.
  No cross-account Route53 access required - CNAME records must be added manually
  to the hosted zone in the DNS account.

Parameters:
  ServiceDomain:
    Description: The apex domain for this certificate (e.g. dev.account.gov.uk)
    Type: String

Resources:
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref ServiceDomain
      ValidationMethod: DNS

Outputs:
  CertificateARN:
    Value: !Ref Certificate
    Description: Certificate ARN
    Export:
      Name: !Sub "${AWS::StackName}-CertificateARN"
