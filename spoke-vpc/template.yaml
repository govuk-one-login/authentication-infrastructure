  #

  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      CidrBlock: !If
        - IsSpokeVpc
        - !Select [3, !Cidr [!GetAtt Vpc.CidrBlock, 12, !FindInMap [VpcSize, Large, PrivateSubnetHostBits]]]
        - !Select [5, !Cidr [!Ref CidrBlock, 8, 9]]
