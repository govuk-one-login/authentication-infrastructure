###################################
#   Resources
###################################

Resources:
  LoggingKmsKey:
    Type: AWS::KMS::Key
    Properties:
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action:
              - "kms:*"
            Resource:
              - "*"
          - Effect: "Allow"
            Principal:
              Service: !Sub "logs.${AWS::Region}.amazonaws.com"
            Action:
              - "kms:Encrypt*"
              - "kms:Decrypt*"
              - "kms:ReEncrypt*"
              - "kms:GenerateDataKey*"
              - "kms:Describe*"
            Resource:
              - "*"
            Condition:
              ArnLike:
                "kms:EncryptionContext:aws:logs:arn": !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:*"

  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      EnableDnsHostnames: true
      EnableDnsSupport: true
      InstanceTenancy: default
      CidrBlock: !If
        - IsLegacyVpc
        - !Ref CidrBlock
        - !Ref AWS::NoValue
      Ipv4NetmaskLength: !If
        - IsSpokeVpc
        - !FindInMap [VpcSize, Large, VpcNetworkPrefixBits]
        - !Ref AWS::NoValue
      Ipv4IpamPoolId: !If
        - IsSpokeVpc
        - !GetAtt CustomGetPoolId.Data
        - !Ref AWS::NoValue
      Tags:
        - Key: "Name"
          Value: !Sub "${AWS::StackName}-Vpc"
        - Key: "Service"
          Value: "ci/cd"
        - Key: "Source"
          Value: "govuk-one-login/devplatform-deploy/vpc/template.yaml"
        - !If
            - IsSpokeVpc
            - Key: "IpamPool"
              Value:
                Fn::FindInMap:
                  - EnvironmentConfiguration
                  - !Ref Environment
                  - IpamPool
                  - DefaultValue: none
            - !Ref AWS::NoValue

  # IAM Role, Lambda Function and Custom Resource for Retrieving IPAM Pool ID that is used by VPC
  CustomGetPoolId:
    Type: Custom::GetIpamPoolId
    Condition: IsSpokeVpc
    Properties:
      ServiceToken: !GetAtt IpamLambdaGetPoolId.Arn

  IpamLambdaRoleGetPoolId:
    Type: AWS::IAM::Role
    Condition: IsSpokeVpc
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Principal:
              Service: "lambda.amazonaws.com"
            Action:
              - "sts:AssumeRole"
      Path: "/"
      ManagedPolicyArns:
        - "arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
      Policies:
        - PolicyName: ipampolicy
          PolicyDocument:
            Statement:
              - Effect: "Allow"
                Action:
                  - "ec2:DescribeIpamPools"
                Resource: "*"

  IpamLambdaGetPoolId:
    Type: AWS::Serverless::Function
    Condition: IsSpokeVpc
    # checkov:skip=CKV_AWS_116: DLQ not required.
    # checkov:skip=CKV_AWS_117: Internet access not required.
    # checkov:skip=CKV_AWS_173: The environment variables do not require encryption.
    Properties:
      ReservedConcurrentExecutions: 5
      CodeUri: ipam-pool
      Environment:
        Variables:
          IPAMPOOL: !FindInMap [EnvironmentConfiguration, !Ref Environment, IpamPool]
      Handler: app.lambda_handler
      MemorySize: 128
      Role: !GetAtt IpamLambdaRoleGetPoolId.Arn
      Runtime: python3.12
      Timeout: 60
      Tags:
        IpamPool: !FindInMap [EnvironmentConfiguration, !Ref Environment, IpamPool]
        Name: !Sub "${AWS::StackName}-IpamLambdaGetPoolId"
        Service: "ci/cd"
        Source: "govuk-one-login/devplatform-deploy/vpc/template.yaml"

  EgressTestLambdaRole:
    Type: AWS::IAM::Role
    Condition: SpokeProvisionEgressTestResources
    # checkov:skip=CKV_AWS_111:states:The mix of VPC permissions don't take a resource
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: "Allow"
            Principal:
              Service: "lambda.amazonaws.com"
            Action:
              - "sts:AssumeRole"
      Path: "/"
      ManagedPolicyArns:
        - "arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
      Policies:
        - PolicyName: egresstestpolicy
          PolicyDocument:
            Statement:
              - Effect: "Allow"
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeDhcpOptions
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DeleteNetworkInterface
                  - ec2:DescribeSubnets
                  - ec2:DescribeSecurityGroups
                  - ec2:DescribeVpcs
                Resource: "*"
                # Permissions can't be scoped to resources

  EgressTestSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: SpokeProvisionEgressTestResources
    Properties:
      GroupDescription: >-
        Permits unrestricted outbound on 443 to allow the egress-test lambda to access the internet over SSL.
      SecurityGroupEgress:
        - CidrIp: 0.0.0.0/0
          Description: Allow to the wider internet on port 443
          FromPort: 443
          IpProtocol: tcp
          ToPort: 443
      VpcId: !Ref Vpc

  EgressTestLambda:
    Type: AWS::Serverless::Function
    # checkov:skip=CKV_AWS_116: DLQ not required.
    # checkov:skip=CKV_AWS_173: The environment variables do not require encryption.
    Condition: SpokeProvisionEgressTestResources
    Properties:
      ReservedConcurrentExecutions: 5
      CodeUri: egress-test
      Environment:
        Variables:
          DEFAULT_URLS: "https://signin.account.gov.uk/"
          CUSTOM_URLS: !Ref EgressTestLambdaCustomURLs
          BLOCKED_URLS: "https://gds-way.digital.cabinet-office.gov.uk/"
          TIMEOUT: 5
      Handler: app.lambda_handler
      MemorySize: 128
      Role: !GetAtt EgressTestLambdaRole.Arn
      Runtime: python3.12
      Timeout: 60
      VpcConfig:
        SecurityGroupIds:
          - !GetAtt EgressTestSecurityGroup.GroupId
        SubnetIds:
          - !Ref ProtectedSubnetA
          - !Ref ProtectedSubnetB
          - !Ref ProtectedSubnetC
      Tags:
        Name: !Sub "${AWS::StackName}-EgressTestLambda"
        Service: "ci/cd"
        Source: "govuk-one-login/devplatform-deploy/vpc/template.yaml"

  ParameterVpcId:
    Type: AWS::SSM::Parameter
    Condition: SSMParametersStoreEnabled
    Properties:
      Name: !Sub "/${AWS::StackName}/VpcId"
      Type: String
      Value: !Ref Vpc
      Description: VPC ID
      Tags:
        Name: !Sub "${AWS::StackName}-ParameterVpcId"
        Service: "ci/cd"
        Source: "govuk-one-login/devplatform-deploy/vpc/template.yaml"

  ParameterVpcCidr:
    Type: AWS::SSM::Parameter
    Condition: SSMParametersStoreEnabled
    Properties:
      Name: !Sub "/${AWS::StackName}/VpcCidr"
      Type: String
      Value: !GetAtt Vpc.CidrBlock
      Description: SSM Parameter for VPC CIDR Range.
      Tags:
        Name: !Sub "${AWS::StackName}-ParameterVpcCidr"
        Service: "ci/cd"
        Source: "govuk-one-login/devplatform-deploy/vpc/template.yaml"

  FlowLogPolicy:
    Type: AWS::IAM::ManagedPolicy
    Condition: ProvisionFlowLogCloudWatch
    Properties:
      ManagedPolicyName:
        Fn::Join:
          - "-"
          - - !Ref AWS::StackName
            - "FlowLogPolicy"
            - Fn::Select:
                - 4
                - Fn::Split:
                    - "-"
                    - Fn::Select:
                        - 2
                        - Fn::Split:
                            - "/"
                            - Ref: AWS::StackId
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - 'logs:CreateLogStream'
              - 'logs:PutLogEvents'
              - 'logs:DescribeLogGroups'
              - 'logs:DescribeLogStreams'
            Resource: !GetAtt 'FlowLogLogGroup.Arn'

  FlowLogRole:
    Type: AWS::IAM::Role
    Condition: ProvisionFlowLogCloudWatch
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: 'vpc-flow-logs.amazonaws.com'
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - !GetAtt FlowLogPolicy.PolicyArn

  FlowLogLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: ProvisionFlowLogCloudWatch
    Properties:
      RetentionInDays: 30
      KmsKeyId: !GetAtt LoggingKmsKey.Arn
      LogGroupClass: "INFREQUENT_ACCESS"

  FlowLog:
    Type: AWS::EC2::FlowLog
    Condition: ProvisionFlowLogCloudWatch
    Properties:
      DeliverLogsPermissionArn: !GetAtt FlowLogRole.Arn
      LogDestinationType: cloud-watch-logs
      LogGroupName: !Ref FlowLogLogGroup
      ResourceId: !Ref Vpc
      ResourceType: VPC
      TrafficType: ALL

  BlockSshRule:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !GetAtt Vpc.DefaultNetworkAcl
      RuleNumber: 30
      Protocol: 6
      RuleAction: deny
      CidrBlock: 0.0.0.0/0
      PortRange:
        From: 22
        To: 22

