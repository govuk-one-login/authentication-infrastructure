  NatGatewayC:
    Type: AWS::EC2::NatGateway
    Condition: LegacyProvisionOutboundInternetInZoneC
    DependsOn: InternetGatewayAttachment
    Properties:
      AllocationId: !If
        - LegacyProvisionZoneCElasticIP
        - !GetAtt NatGatewayZoneCEIP.AllocationId
        - !Ref ZoneCEIPAllocationId
      SubnetId: !Ref PublicSubnetC
      ConnectivityType: public
      Tags:
        - Key: "Name"
          Value: !Sub "${AWS::StackName}-NatGatewayC"
