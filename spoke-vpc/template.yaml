  #
  # VPC Endpoint (common)
  #

  AwsServicesEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security Group to access AWS services via VPC endpoints
      GroupName: !Join
        - "-"
        - - !Ref AWS::StackName
          - "AwsServicesEndpoint"
          - Fn::Select:
              - 4
              - Fn::Split:
                  - "-"
                  - Fn::Select:
                      - 2
                      - Fn::Split:
                          - "/"
                          - Ref: AWS::StackId
      VpcId: !Ref Vpc
      Tags:
        - Key: "Name"
          Value: !Sub "${AWS::StackName}-AwsServicesEndpointSecurityGroup"
        - Key: "Service"
          Value: "ci/cd"
        - Key: "Source"
          Value: "govuk-one-login/devplatform-deploy/vpc/template.yaml"

  ParameterAWSServicesEndpointSecurityGroupId:
    Type: AWS::SSM::Parameter
    Condition: SSMParametersStoreEnabled
    Properties:
      Name: !Sub "/${AWS::StackName}/AWSServicesEndpointSecurityGroupId"
      Type: String
      Value: !GetAtt AwsServicesEndpointSecurityGroup.GroupId
      Description: SSMParametersStore AWSServicesEndpointSecurityGroupId
      Tags:
        Name: !Sub "${AWS::StackName}-ParameterAWSServicesEndpointSecurityGroupId"
