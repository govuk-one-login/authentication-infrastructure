        Source: "govuk-one-login/devplatform-deploy/vpc/template.yaml"

  AwsServicesEndpointSecurityGroupIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Allow traffic into endpoints on port 443
      GroupId: !GetAtt AwsServicesEndpointSecurityGroup.GroupId
      CidrIp: !GetAtt Vpc.CidrBlock
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443

  AwsServicesEndpointSecurityGroupIngressSES465:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Allow traffic into endpoints on port 465 for SMTPS
      GroupId: !GetAtt AwsServicesEndpointSecurityGroup.GroupId
      CidrIp: !GetAtt Vpc.CidrBlock
      IpProtocol: tcp
      FromPort: 465
      ToPort: 465

  AwsServicesEndpointSecurityGroupIngressSES587:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Allow traffic into endpoints on port 587 for secure mail submission
      GroupId: !GetAtt AwsServicesEndpointSecurityGroup.GroupId
      CidrIp: !GetAtt Vpc.CidrBlock
      IpProtocol: tcp
      FromPort: 587
      ToPort: 587

  AwsServicesEndpointSecurityGroupIngressSES2465:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      Description: Allow traffic into endpoints on port 2465 for SES SMTP endpoint
      GroupId: !GetAtt AwsServicesEndpointSecurityGroup.GroupId
      CidrIp: !GetAtt Vpc.CidrBlock
      IpProtocol: tcp
      FromPort: 2465
      ToPort: 2465

  AwsServicesEndpointSecurityGroupIngressSES2587:
