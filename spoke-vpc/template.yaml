          Value: "govuk-one-login/devplatform-deploy/vpc/template.yaml"

  Route53FirewallRuleGroup:
    Type: AWS::Route53Resolver::FirewallRuleGroup
    Properties:
      FirewallRules:
        - Action: "ALLOW"
          FirewallDomainListId: !Ref Route53FirewallMatchAWSDomainList
          FirewallDomainRedirectionAction: TRUST_REDIRECTION_DOMAIN
          Priority: 100
        - !If
          - ProvisionDynatraceVPCEndpoint
          - Action: "ALLOW"
            FirewallDomainListId: !Ref Route53FirewallMatchDynatraceDomainList
            FirewallDomainRedirectionAction: TRUST_REDIRECTION_DOMAIN
            Priority: 200
          - !Ref AWS::NoValue
        - !If
          - ProvisionOutboundInternet
          - Action: "ALLOW"
            FirewallDomainListId: !Ref Route53FirewallMatchDefaultDomainsList
            FirewallDomainRedirectionAction: TRUST_REDIRECTION_DOMAIN
            Priority: 201
          - !Ref AWS::NoValue
        - !If
          - ProvisionAllowedDomainsList
          - Action: "ALLOW"
            FirewallDomainListId: !Ref Route53FirewallMatchAllowedDomainsList
            FirewallDomainRedirectionAction: TRUST_REDIRECTION_DOMAIN
            Priority: 300
          - !Ref AWS::NoValue
        - Action: "BLOCK"
          BlockResponse: "NODATA"
          FirewallDomainListId: !Ref Route53FirewallMatchAllDomainList
          FirewallDomainRedirectionAction: !If
            - IsSpokeVpc
            - TRUST_REDIRECTION_DOMAIN
            - !Ref AWS::NoValue
          Priority: 1000
      Tags:
        - Key: "Name"
          Value: !Sub "${AWS::StackName}-Route53FirewallRuleGroup"
        - Key: "Service"
          Value: "ci/cd"
        - Key: "Source"
          Value: "govuk-one-login/devplatform-deploy/vpc/template.yaml"

  Route53FirewallRuleGroupAssociation:
    Type: AWS::Route53Resolver::FirewallRuleGroupAssociation
    Properties:
      FirewallRuleGroupId: !Ref Route53FirewallRuleGroup
      Priority: 1000
      VpcId: !Ref Vpc
      Tags:
        - Key: "Name"
          Value: !Sub "${AWS::StackName}-Route53FirewallRuleGroupAssociation"
        - Key: "Service"
          Value: "ci/cd"
        - Key: "Source"
          Value: "govuk-one-login/devplatform-deploy/vpc/template.yaml"

  #
  # Rest api gateway vpc link
  #

  ApiGatewayVpcLink:
    Condition: ProvisionRestAPIGWVpcLink
    Type: AWS::ApiGateway::VpcLink
    Properties:
      Description: Link from REST API Gateway to NetworkLoadBalancer
      Name: !Sub "${AWS::StackName}-ApiVpcLink"
      TargetArns:
        - !Ref NetworkLoadBalancer

  ParameterApiGatewayVpcLinkId:
    Type: AWS::SSM::Parameter
    Condition: CreateSSMParameterForApiGatewayVpcLinkId
    Properties:
      Name: !Sub "/${AWS::StackName}/ApiGatewayVpcLinkId"
      Type: String
      Value: !Ref ApiGatewayVpcLink
      Description: SSMParameterStoreCreate ApiGatewayVpcLinkId
      Tags:
        Name: !Sub "${AWS::StackName}-ParameterApiGatewayVpcLinkId"
        Service: "ci/cd"
        Source: "govuk-one-login/devplatform-deploy/vpc/template.yaml"

  NetworkLoadBalancer:
    Condition: ProvisionRestAPIGWVpcLink
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internal
      Type: network
      Subnets: !If
        - IsLegacyVpc
        - [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
        - [!Ref PrivateSubnetA, !Ref PrivateSubnetB, !Ref PrivateSubnetC]
      LoadBalancerAttributes:
        - Key: access_logs.s3.enabled
          Value: "true"
        - Key: access_logs.s3.bucket
          Value: !Sub "di-lb-access-logs-${AWS::AccountId}-${AWS::Region}"
        - Key: access_logs.s3.prefix
          Value: vpc-network-lb
        - !If
          - ProvisionNlbCrossZone
          - Key: load_balancing.cross_zone.enabled
            Value: 'true'
          - !Ref AWS::NoValue
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-NetworkLoadBalancer"
        - Key: Service
          Value: ci/cd
        - Key: Source
          Value: govuk-one-login/devplatform-deploy/vpc/template.yaml

  ParameterApiGatewayVpcLinkTargetNLB:
    Type: AWS::SSM::Parameter
    Condition: CreateSSMParameterForApiGatewayVpcLinkId
    Properties:
      Name: !Sub "/${AWS::StackName}/ApiGatewayVpcLinkTargetNLB"
      Type: String
      Value: !Ref NetworkLoadBalancer
      Description: SSMParameterStoreCreate ApiGatewayVpcLinkTargetNLB
      Tags:
        Name: !Sub "${AWS::StackName}-ParameterApiGatewayVpcLinkTargetNLB"
        Service: "ci/cd"
        Source: "govuk-one-login/devplatform-deploy/vpc/template.yaml"

  ParameterApiGatewayVpcLinkTargetNLBDNS:
    Type: AWS::SSM::Parameter
    Condition: CreateSSMParameterForApiGatewayVpcLinkId
    Properties:
      Name: !Sub "/${AWS::StackName}/ApiGatewayVpcLinkTargetNLBDNS"
      Type: String
      Value: !GetAtt NetworkLoadBalancer.DNSName
      Description: SSMParameterStoreCreate ApiGatewayVpcLinkTargetNLBDNS
      Tags:
        Name: !Sub "${AWS::StackName}-ParameterApiGatewayVpcLinkTargetNLBDNS"
        Service: "ci/cd"
        Source: "govuk-one-login/devplatform-deploy/vpc/template.yaml"

  # Deprecated: retained to avoid deleting existing legacy NLB access-log storage.
  # Network Load Balancer access logs are now written to di-lb-access-logs-<account-id>-<region>.
  AccessLogsBucket:
    Condition: ProvisionRestAPIGWVpcLink
    Type: AWS::S3::Bucket
    Properties:
      # checkov:skip=CKV_AWS_18:This is the access logs bucket. It should not log itself.
      BucketName: !If
        - AccessLogsCustomBucketName
        - !Join
          - "-"
          - - !Ref AWS::StackName
            - logs
            - Fn::Select:
                - 4
                - Fn::Split:
                    - '-'
                    - Fn::Select:
                        - 2
                        - Fn::Split:
                            - /
                            - Ref: AWS::StackId
        - !Ref AWS::NoValue
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-accesslogs"
        - Key: Service
          Value: ci/cd
        - Key: Source
          Value: govuk-one-login/devplatform-deploy/vpc/template.yaml
        - Key: CheckovRulesToSkip
          Value: CKV_AWS_18

  # Deprecated: retained to avoid deleting existing legacy NLB access-log storage.
  # Network Load Balancer access logs are now written to di-lb-access-logs-<account-id>-<region>.
  AccessLogsBucketPolicy:
    Condition: ProvisionRestAPIGWVpcLink
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AccessLogsBucket
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: AllowLoadBalancerToLogToS3
            Effect: Allow
            Principal:
              AWS: !Sub
                - "arn:aws:iam::${ElbAccountId}:root"
                - ElbAccountId: !FindInMap [ElasticLoadBalancerAccountIds, !Ref AWS::Region, AccountId]
            Action:
              - s3:PutObject
            Resource: !Sub "${AccessLogsBucket.Arn}/AWSLogs/${AWS::AccountId}/*"
          - Sid: AllowAwsLogDeliveryToLogToS3
            Effect: Allow
            Principal:
              Service: delivery.logs.amazonaws.com
            Action:
              - s3:PutObject
            Resource: !Sub "${AccessLogsBucket.Arn}/AWSLogs/${AWS::AccountId}/*"
            Condition:
              StringEquals:
                "s3:x-amz-acl": bucket-owner-full-control
                "aws:SourceAccount": !Ref AWS::AccountId
          - Sid: AllowAwsLogDeliveryToReadBucketAcl
            Effect: Allow
            Principal:
              Service: delivery.logs.amazonaws.com
            Action:
              - s3:GetBucketAcl
            Resource: !GetAtt AccessLogsBucket.Arn
            Condition:
              StringEquals:
                "aws:SourceAccount": !Ref AWS::AccountId
          - Sid: AllowSSLRequestsOnly
            Effect: Deny
            Action:
              - "s3:*"
            Resource:
              - !Sub "${AccessLogsBucket.Arn}/*"
            Principal: "*"
            Condition:
              Bool:
                "aws:SecureTransport": "false"

  #
  # VPC Link
  #

  VpcLink:
    Type: AWS::ApiGatewayV2::VpcLink
    Condition: ProvisionVpcLink
    Properties:
      Name: ApiGatewayLinkToPrivateSubnets
      SubnetIds: !If
        - ProvisionAvailabilityZoneC
        - [!Ref PrivateSubnetA, !Ref PrivateSubnetB, !Ref PrivateSubnetC]
        - [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
